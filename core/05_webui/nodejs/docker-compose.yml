# Local-dev PostgreSQL for the GAD account store (signup / OTP / admin accounts).
#
# All three bots (chips/fg/fg2) share this ONE database; rows are isolated by a
# `pipeline` column, so every bot's .env points at the same DATABASE_URL. The
# gad_users schema is created automatically by the app on first boot — this file
# only provides the server.
#
#   docker compose up -d          # start Postgres on localhost:5432
#   docker compose logs -f db      # watch it
#   docker compose down            # stop (keeps data)
#   docker compose down -v         # stop AND wipe the data volume
#
# Matches the default in .env.example:
#   DATABASE_URL=postgres://gad:changeme@127.0.0.1:5432/gad
#
# This is for LOCAL DEVELOPMENT only. On the Rocky Linux VM, install PostgreSQL
# natively instead — see deploy/setup-postgres.sh.

services:
  db:
    image: postgres:16-alpine
    container_name: gad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gad
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: gad
    ports:
      - "5432:5432"
    volumes:
      - gad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gad -d gad"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gad_pgdata:
